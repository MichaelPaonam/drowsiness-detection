name: Discord Notifications

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

  pull_request_review:
    types:
      - submitted

  issue_comment:
    types:
      - created

  pull_request_review_comment:
    types:
      - created

  issues:
    types:
      - closed

  milestone:
    types:
      - closed

  workflow_run:
    types:
      - completed
    workflows:
      - "*"

permissions:
  contents: read
  security-events: read

jobs:
  notify:
    # Only notify for failed workflow runs
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Build message
        id: message
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          COMPARE_URL: ${{ github.event.compare }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REVIEW_URL: ${{ github.event.review.html_url }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          MILESTONE_TITLE: ${{ github.event.milestone.title }}
          MILESTONE_URL: ${{ github.event.milestone.html_url }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          ALERT_URL: ${{ github.event.alert.html_url }}
        run: |
          case "$EVENT" in
            push)
              MSG="🚀 Push to main by $ACTOR"
              URL="$COMPARE_URL"
              ;;
            pull_request)
              MSG="🔀 Pull Request: $PR_TITLE"
              URL="$PR_URL"
              ;;
            pull_request_review)
              MSG="👀 PR Review by $ACTOR"
              URL="$REVIEW_URL"
              ;;
            issue_comment)
              MSG="💬 PR Comment by $ACTOR"
              URL="$COMMENT_URL"
              ;;
            pull_request_review_comment)
              MSG="💭 Review Comment by $ACTOR"
              URL="$COMMENT_URL"
              ;;
            issues)
              MSG="🐛 Issue closed by $ACTOR"
              URL="$ISSUE_URL"
              ;;
            milestone)
              MSG="🎯 Milestone closed: $MILESTONE_TITLE"
              URL="$MILESTONE_URL"
              ;;
            workflow_run)
              MSG="❌ Workflow Failed: $WORKFLOW_NAME"
              URL="$WORKFLOW_URL"
              ;;
            code_scanning_alert)
              MSG="🚨 Code Scanning Alert"
              URL="$ALERT_URL"
              ;;
            secret_scanning_alert)
              MSG="🔐 Secret Scanning Alert"
              URL="$ALERT_URL"
              ;;
          esac

          echo "msg=$MSG" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Send Discord notification
        env:
          MSG_OUT: ${{ steps.message.outputs.msg }}
          URL_OUT: ${{ steps.message.outputs.url }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl \
            -H "Content-Type: application/json" \
            -X POST \
            -d "{\n              \"content\": \"$MSG_OUT\n$URL_OUT\"\n            }" \
            "$DISCORD_WEBHOOK"
